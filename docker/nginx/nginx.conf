user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # --- Rate limiting na edge (V6) -----------------------------------------
    #
    # Estes limites são por IP, e o IP real do aluno só é fiável graças ao
    # `set_real_ip_from` do Cloudflare mais abaixo. Em Angola a maioria dos
    # utilizadores está atrás de um CGNAT: dezenas de alunos partilham um único
    # endereço público. Por isso as taxas são largas o suficiente para uma turma
    # inteira entrar ao mesmo tempo, e `burst` deixa passar o pico do início das
    # aulas. A justiça entre utilizadores — "este aluno não pode fazer 60
    # pedidos por minuto" — é trabalho dos limiters do Laravel, que são por
    # utilizador. Aqui o objectivo é um só: absorver volumetria antes de cada
    # pedido gastar um worker do PHP.
    #
    # `limit_conn` foi deixado de fora de propósito: com um CGNAT, uma sala de
    # 300 alunos legítimos com 300 ligações simultâneas a um único IP seria
    # cortada de serviços. O problema que trago resolve-se com Cloudflare.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;

    # 503 por omissão diria ao cliente "o servidor está em baixo", o que é
    # mentira e quebra o contrato de erro da API: tem de ser 429.
    limit_req_status 429;
    limit_req_log_level warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream PHP-FPM
    upstream php {
        server app:9000;
    }

    server {
        listen 80;
        server_name _;

        # Cloudflare trusted IPs
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        real_ip_header CF-Connecting-IP;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Laravel application
        root /app/public;

        index index.php;

        charset utf-8;

        # Autenticação: zona mais apertada. `burst=30 nodelay` deixa entrar uma
        # turma inteira no mesmo instante; depois disso, 1 pedido a cada 2s.
        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=30 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # API geral: absorve flood sem curtainar o uso legítimo.
        location /api/ {
            limit_req zone=api_zone burst=100 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Handle frontend routes
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Handle Vite assets
        location ~* \.(?:css|js|woff2?|ttf|eot|ico|svg|gif|jpe?g|png|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffering off;
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
        }

        # Deny access to hidden files
        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # Optional: HTTPS server block (if not using Cloudflare)
    # Uncomment if you want direct SSL without Cloudflare
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     # ... same config as above
    # }
}
