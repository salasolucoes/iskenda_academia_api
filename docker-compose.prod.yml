services:
    # ============================================
    # Laravel App (PHP-FPM)
    # ============================================
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: iskenda-app
        restart: unless-stopped
        networks:
            - iskenda
        volumes:
            - .:/app
            - ./storage:/app/storage
            - ./bootstrap/cache:/app/bootstrap/cache
        environment:
            - APP_ENV=production
            - APP_DEBUG=false
        depends_on:
            - pgsql
            - redis

    # ============================================
    # Nginx (Reverse Proxy + Static Files)
    # ============================================
    nginx:
        image: nginx:alpine
        container_name: iskenda-nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - .:/app
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./docker/nginx/ssl:/etc/nginx/ssl:ro
        networks:
            - iskenda
        depends_on:
            - app

    # ============================================
    # PostgreSQL
    # ============================================
    pgsql:
        image: postgres:18-alpine
        container_name: iskenda-pgsql
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-iskenda}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgsql-data:/var/lib/postgresql/data
        networks:
            - iskenda
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-iskenda}", "-U", "${DB_USERNAME:-postgres}"]
            retries: 3
            timeout: 5s

    # ============================================
    # Redis
    # ============================================
    redis:
        image: redis:alpine
        container_name: iskenda-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        volumes:
            - redis-data:/data
        networks:
            - iskenda
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

    # ============================================
    # MinIO (Object Storage)
    # ============================================
    minio:
        image: minio/minio:latest
        container_name: iskenda-minio
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        volumes:
            - minio-data:/data
        networks:
            - iskenda
        command: server /data --console-address ":9001"
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            retries: 3
            timeout: 5s

    # ============================================
    # MinIO Init (Create Bucket)
    # ============================================
    minio-init:
        image: minio/mc:latest
        container_name: iskenda-minio-init
        depends_on:
            minio:
                condition: service_healthy
        networks:
            - iskenda
        entrypoint: >
            /bin/sh -c "
            mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
            mc mb myminio/iskenda --ignore-existing
            mc anonymous set download myminio/iskenda/public
            "

    # ============================================
    # Laravel Reverb (WebSockets)
    # ============================================
    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: iskenda-reverb
        restart: unless-stopped
        networks:
            - iskenda
        volumes:
            - .:/app
            - ./storage:/app/storage
        environment:
            - APP_ENV=production
            - REVERB_SERVER_HOST=0.0.0.0
            - REVERB_SERVER_PORT=8080
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        depends_on:
            - app
            - redis

    # ============================================
    # Queue Worker
    # ============================================
    queue:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: iskenda-queue
        restart: unless-stopped
        networks:
            - iskenda
        volumes:
            - .:/app
            - ./storage:/app/storage
        environment:
            - APP_ENV=production
        command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
        depends_on:
            - app
            - redis

    # ============================================
    # Scheduler (Cron)
    # ============================================
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: iskenda-scheduler
        restart: unless-stopped
        networks:
            - iskenda
        volumes:
            - .:/app
            - ./storage:/app/storage
        environment:
            - APP_ENV=production
        command: >
            /bin/sh -c "
            echo '* * * * * cd /app && php artisan schedule:run >> /dev/null 2>&1' > /etc/crontabs/root
            crond -f -l 8
            "
        depends_on:
            - app
            - redis

    # ============================================
    # PostgreSQL Backup
    # ============================================
    pgbackup:
        image: prodrigestivill/postgres-backup-local:latest
        container_name: iskenda-pgbackup
        restart: unless-stopped
        environment:
            POSTGRES_HOST: pgsql
            POSTGRES_DB: ${DB_DATABASE:-iskenda}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            SCHEDULE: "@daily"
            BACKUP_KEEP_DAYS: 7
            BACKUP_KEEP_WEEKS: 4
            BACKUP_KEEP_MONTHS: 6
            HEALTHCHECK_PORT: 8080
        volumes:
            - ./docker/pgbackup:/backups
        networks:
            - iskenda
        depends_on:
            pgsql:
                condition: service_healthy

networks:
    iskenda:
        driver: bridge

volumes:
    pgsql-data:
        driver: local
    redis-data:
        driver: local
    minio-data:
        driver: local
